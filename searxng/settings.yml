# SearXNG settings for local AI chatbot integration

use_default_settings: true

general:
  debug: false
  instance_name: "LocalAI Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json          # required for API access from the backend

server:
  secret_key: "localai-searxng-secret-change-me"
  limiter: false    # disable rate limiting for local use
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_locale: "en"
  theme_args:
    simple_style: dark

# Engines to use — a fast, reliable set for general queries
engines:
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: b

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: "https://en.wikipedia.org/"

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
